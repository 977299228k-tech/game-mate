worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format security '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
                        'rt=$request_time ua="$http_user_agent"';
    access_log /dev/stdout security;
    error_log /dev/stderr warn;

    server_tokens off;
    sendfile on;
    keepalive_timeout 30s;
    client_header_timeout 10s;
    client_body_timeout 30s;
    reset_timedout_connection on;

    limit_conn_zone $binary_remote_addr zone=per_ip_connections:10m;
    limit_req_zone $binary_remote_addr zone=general_api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=auth_api:10m rate=6r/m;
    limit_req_zone $binary_remote_addr zone=upload_api:10m rate=2r/s;
    limit_req_status 429;
    limit_conn_status 429;

    upstream game_mate_api {
        server api:8080;
        keepalive 32;
    }

    server {
        listen 8080;
        server_name _;

        limit_conn per_ip_connections 20;
        client_max_body_size 4m;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), geolocation=(), payment=()" always;

        if ($request_method !~ ^(GET|POST|PUT|DELETE|OPTIONS|HEAD)$) {
            return 405;
        }

        location ~* ^/(?:\.|actuator(?:/|$)|swagger(?:/|$)|swagger-ui(?:/|$)|v3/api-docs(?:/|$)|wp-admin(?:/|$)|phpmyadmin(?:/|$)) {
            return 404;
        }

        location ~ ^/api/user/(login|register)$ {
            limit_req zone=auth_api burst=3 nodelay;
            proxy_pass http://game_mate_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /api/chat/messages-with-personality/stream {
            limit_req zone=general_api burst=20 nodelay;
            proxy_pass http://game_mate_api;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 150s;
            proxy_send_timeout 150s;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location ~ ^/api/(?:game/icon(?:s)?|highlight)(?:/|$) {
            limit_req zone=upload_api burst=4 nodelay;
            client_max_body_size 110m;
            proxy_pass http://game_mate_api;
            proxy_request_buffering on;
            proxy_read_timeout 150s;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/ {
            limit_req zone=general_api burst=30 nodelay;
            proxy_pass http://game_mate_api;
            proxy_read_timeout 150s;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /uploads/ {
            limit_req zone=general_api burst=30 nodelay;
            limit_except GET OPTIONS {
                deny all;
            }
            proxy_pass http://game_mate_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            return 404;
        }
    }
}
