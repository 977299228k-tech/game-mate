server:
  port: 8080

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

logging:
  level:
    com.gamemate: INFO
    org.springframework.security: WARN

game-mate:
  cors:
    allowed-origins: ${GAME_MATE_ALLOWED_ORIGINS:gamemate://app}
  file:
    upload-path: /data/game-mate/uploads/
