server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://your-prod-host:3306/game_mate?useUnicode=true&characterEncoding=utf-8&useSSL=true&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=false
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

game-mate:
  file:
    upload-path: /data/game-mate/uploads/