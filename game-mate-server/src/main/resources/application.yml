server:
  port: 8080

spring:
  application:
    name: game-mate-server
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

  servlet:
    multipart:
      enabled: true
      max-file-size: 100MB
      max-request-size: 100MB

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/game_mate?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:gamemate}
    password: ${DB_PASSWORD:}
  sql:
    init:
      mode: ${SPRING_SQL_INIT_MODE:never}

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.gamemate.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false

logging:
  level:
    root: INFO
    com.gamemate: DEBUG
    org.mybatis.spring.mapper.ClassPathMapperScanner: ERROR
    org.springframework.security: WARN
    org.springframework.boot.autoconfigure.security: ERROR

game-mate:
  cors:
    allowed-origins: ${GAME_MATE_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4173,gamemate://app}
  jwt:
    secret: ${JWT_SECRET:default-dev-secret-key-at-least-32-bytes-long}
    expiration: ${JWT_EXPIRATION:86400000}
  file:
    upload-path: ./uploads/
  firewall:
    enabled: ${GAME_MATE_FIREWALL_ENABLED:true}
    general-requests-per-minute: ${GAME_MATE_FIREWALL_GENERAL_PER_MINUTE:240}
    auth-attempts-per-five-minutes: ${GAME_MATE_FIREWALL_AUTH_PER_FIVE_MINUTES:12}
    max-json-bytes: ${GAME_MATE_FIREWALL_MAX_JSON_BYTES:4194304}
    max-upload-bytes: ${GAME_MATE_FIREWALL_MAX_UPLOAD_BYTES:115343360}
  ai:
    enabled: ${AI_ENABLED:false}
    provider: ${AI_PROVIDER:qwen}
    api-key: ${AI_API_KEY:}
    api-url: ${AI_API_URL:https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions}
    model: ${AI_MODEL:qwen-plus}
    vision-model: ${AI_VISION_MODEL:qwen-vl-plus}
    system-prompt: "你是一个专业的AI游戏陪玩助手，擅长分析游戏局势、提供详细战术建议、帮助玩家提升游戏水平。请用详细、具体、专业、友好的方式回答玩家的问题。回答时请：1. 提供具体的操作步骤和建议；2. 分析多种可能的战术选择；3. 结合当前游戏版本和主流打法；4. 给出可执行的具体方案。"
    temperature: 0.7
    max-tokens: 2000
