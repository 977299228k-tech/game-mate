server:
  port: 8080

spring:
  application:
    name: game-mate-server
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

  servlet:
    multipart:
      enabled: true
      max-file-size: 100MB
      max-request-size: 100MB

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/game_mate?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:gamemate}
    password: ${DB_PASSWORD:}

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.gamemate.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false

logging:
  level:
    root: INFO
    com.gamemate: DEBUG
    org.mybatis.spring.mapper.ClassPathMapperScanner: ERROR
    org.springframework.security: DEBUG
    org.springframework.boot.autoconfigure.security: ERROR

game-mate:
  jwt:
    secret: ${JWT_SECRET}
    expiration: ${JWT_EXPIRATION:86400000}
  file:
    upload-path: ./uploads/
  ai:
    enabled: ${AI_ENABLED:false}
    provider: ${AI_PROVIDER:qwen}
    api-key: ${AI_API_KEY:}
    api-url: ${AI_API_URL:https://token-plan.cn-beijing.maas.aliyuncs.com/compatible-mode/v1/chat/completions}
    model: ${AI_MODEL:qwen3.8-max-preview}
    vision-model: ${AI_VISION_MODEL:qwen3.8-max-preview}
    system-prompt: "你是一个专业的AI游戏陪玩助手，擅长分析游戏局势、提供详细战术建议、帮助玩家提升游戏水平。请用详细、具体、专业、友好的方式回答玩家的问题。回答时请：1. 提供具体的操作步骤和建议；2. 分析多种可能的战术选择；3. 结合当前游戏版本和主流打法；4. 给出可执行的具体方案。"
    temperature: 0.7
    max-tokens: 2000
